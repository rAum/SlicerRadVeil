name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # Python 3.9 (Slicer 5.6) is gone from Ubuntu 26.04
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy pytest pyflakes packaging
      - run: pyflakes RadVeil tests tools
      - run: pytest tests/

  packaging:
    name: Packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/stage_module.py --check
      - run: python tools/stage_module.py stage --zip radveil-slicer-module.zip
      - uses: actions/upload-artifact@v4
        with:
          name: radveil-slicer-module
          path: radveil-slicer-module.zip

  slicer:
    name: Self-test in Slicer ${{ matrix.stability == 'release' && 'Stable' || 'Preview' }} (Linux)
    needs: packaging
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stability: [release, nightly]
    steps:
      - uses: actions/checkout@v5
      - name: Find the latest Slicer
        id: find
        run: |
          curl -fsSL "https://download.slicer.org/find?os=linux&stability=${{ matrix.stability }}" -o slicer.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("slicer.json"))
          print(f"version={d['version']}")
          print(f"revision={d['revision']}")
          print(f"url=https://download.slicer.org{d['download_url']}")
          print(f"sha512={d['sha512']}")
          PY
      - uses: actions/cache@v4
        id: cache
        with:
          path: slicer-dist
          key: slicer-linux-${{ steps.find.outputs.revision }}
      - name: Download Slicer ${{ steps.find.outputs.version }} (r${{ steps.find.outputs.revision }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "${{ steps.find.outputs.url }}" -o slicer.tar.gz
          echo "${{ steps.find.outputs.sha512 }}  slicer.tar.gz" | sha512sum -c -
          mkdir slicer-dist && tar -xzf slicer.tar.gz -C slicer-dist --strip-components=1
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libglu1-mesa libegl1 libopengl0 libpulse-mainloop-glib0 \
            libnss3 libxdamage1 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-cursor0 \
            libasound2t64 libdbus-1-3 libfontconfig1
      - name: Self-test (packaged module, mock backend)
        run: |
          python3 tools/stage_module.py "$RUNNER_TEMP/stage"
          tools/ci_run_selftest.sh "$PWD/slicer-dist/Slicer" "$RUNNER_TEMP/stage/RadVeil" "$RUNNER_TEMP/selftest.log"
