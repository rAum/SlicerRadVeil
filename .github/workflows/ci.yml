name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:  # the release gate (release.yml)

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # Python 3.9 (Slicer 5.6) is gone from Ubuntu 26.04
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy pytest pyflakes packaging
      - run: pyflakes RadVeil tests tools
      - run: pytest tests/

  packaging:
    name: Packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/stage_module.py --check
      - run: python tools/stage_module.py stage --zip radveil-slicer-module.zip
      - uses: actions/upload-artifact@v4
        with:
          name: radveil-slicer-module
          path: radveil-slicer-module.zip

  slicer:
    name: Self-test in Slicer ${{ matrix.stability == 'release' && 'Stable' || 'Preview' }} (Linux)
    needs: packaging
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stability: [release, nightly]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-slicer
        id: slicer
        with:
          stability: ${{ matrix.stability }}
      - name: Self-test (packaged module, mock backend) in Slicer ${{ steps.slicer.outputs.version }}
        run: |
          python3 tools/stage_module.py "$RUNNER_TEMP/stage"
          tools/ci_run_selftest.sh "${{ steps.slicer.outputs.slicer }}" "$RUNNER_TEMP/stage/RadVeil" "$RUNNER_TEMP/selftest.log"

  real:
    name: Real radveil on MRHead + screenshots (Slicer Stable, Linux)
    needs: packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-slicer
        id: slicer
        with:
          stability: release
      - name: Install radveil into Slicer's Python
        run: |
          requirement="$(python3 tools/radveil_requirement.py)"
          "${{ steps.slicer.outputs.python }}" -m pip install --only-binary=:all: "$requirement"
          "${{ steps.slicer.outputs.python }}" -c "import radveil; print('radveil', radveil.__version__)"
      - name: Self-test with the real package on MRHead
        env:
          RADVEIL_SLICER_TEST_REAL: "1"
          RADVEIL_EXPECT_REAL: "1"
        run: |
          python3 tools/stage_module.py "$RUNNER_TEMP/stage"
          tools/ci_run_selftest.sh "${{ steps.slicer.outputs.slicer }}" "$RUNNER_TEMP/stage/RadVeil" "$RUNNER_TEMP/selftest.log"
      - name: Screenshots
        env:
          RADVEIL_SCREENSHOT_DIR: ${{ github.workspace }}/Screenshots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24" "${{ steps.slicer.outputs.slicer }}" --no-splash \
            --additional-module-paths "$RUNNER_TEMP/stage/RadVeil" --python-script tools/make_screenshots.py
          sudo apt-get install -y -q python3-pil
          python3 tools/compose_screenshot.py Screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: Screenshots/
          if-no-files-found: warn
