name: Set up 3D Slicer (Linux)
description: >
  Download the latest Slicer Stable or Preview for Linux from download.slicer.org,
  verify its SHA-512, cache it by revision and install the system libraries it needs.

inputs:
  stability:
    description: "release (Stable) or nightly (Preview)"
    default: release

outputs:
  slicer:
    description: Path of the Slicer launcher
    value: ${{ steps.paths.outputs.slicer }}
  python:
    description: Path of Slicer's Python (PythonSlicer)
    value: ${{ steps.paths.outputs.python }}
  version:
    description: Slicer version, e.g. 5.12.4
    value: ${{ steps.find.outputs.version }}

runs:
  using: composite
  steps:
    - name: Find the latest Slicer
      id: find
      shell: bash
      run: |
        curl -fsSL "https://download.slicer.org/find?os=linux&stability=${{ inputs.stability }}" -o "$RUNNER_TEMP/slicer.json"
        python3 - "$RUNNER_TEMP/slicer.json" <<'PY' >> "$GITHUB_OUTPUT"
        import json, sys
        d = json.load(open(sys.argv[1]))
        print(f"version={d['version']}")
        print(f"revision={d['revision']}")
        print(f"url=https://download.slicer.org{d['download_url']}")
        print(f"sha512={d['sha512']}")
        PY
    - uses: actions/cache@v4
      id: cache
      with:
        path: ${{ runner.temp }}/slicer-dist
        key: slicer-linux-${{ steps.find.outputs.revision }}
    - name: Download Slicer ${{ steps.find.outputs.version }} (r${{ steps.find.outputs.revision }})
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL "${{ steps.find.outputs.url }}" -o "$RUNNER_TEMP/slicer.tar.gz"
        echo "${{ steps.find.outputs.sha512 }}  $RUNNER_TEMP/slicer.tar.gz" | sha512sum -c -
        mkdir "$RUNNER_TEMP/slicer-dist"
        tar -xzf "$RUNNER_TEMP/slicer.tar.gz" -C "$RUNNER_TEMP/slicer-dist" --strip-components=1
        rm "$RUNNER_TEMP/slicer.tar.gz"
    - name: System libraries
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q xvfb libglu1-mesa libegl1 libopengl0 libpulse-mainloop-glib0 \
          libnss3 libxdamage1 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6 \
          libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
          libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-cursor0 \
          libasound2t64 libdbus-1-3 libfontconfig1
    - id: paths
      shell: bash
      run: |
        echo "slicer=$RUNNER_TEMP/slicer-dist/Slicer" >> "$GITHUB_OUTPUT"
        echo "python=$RUNNER_TEMP/slicer-dist/bin/PythonSlicer" >> "$GITHUB_OUTPUT"
